<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Path for top curved text: RED TEAM -->
    <path id="redTopTextPath" d="M 95,305 A 165,165 0 0,1 405,305" fill="none" />
    <!-- Path for bottom curved text: FOOTBALL CLUB -->
    <path id="redBottomTextPath" d="M 415,305 A 175,175 0 0,1 85,305" fill="none" />
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Crown on Top -->
  <g id="crown" transform="translate(0, 0)">
    <!-- Base arch -->
    <path d="M 210,132 C 235,138 265,138 290,132 C 285,126 270,123 250,123 C 230,123 215,126 210,132 Z" fill="#FF2626" />
    <!-- Crown Body with 5 Prongs -->
    <path d="M 190,120 L 195,78 L 220,105 L 250,56 L 280,105 L 305,78 L 310,120 C 285,127 215,127 190,120 Z" fill="#FF2626" />
    <!-- Crown Jewels / Circles on top of tips -->
    <circle cx="195" cy="74" r="7" fill="#FF2626" />
    <circle cx="222" cy="100" r="6" fill="#FF2626" />
    <circle cx="250" cy="50" r="9" fill="#FF2626" />
    <circle cx="278" cy="100" r="6" fill="#FF2626" />
    <circle cx="305" cy="74" r="7" fill="#FF2626" />
  </g>

  <!-- Main Circular Crest -->
  <g transform="translate(0, 0)">
    <!-- Outer Red Base -->
    <circle cx="250" cy="310" r="200" fill="#FF2626" />
    <!-- Outer White Ring -->
    <circle cx="250" cy="310" r="192" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
    <!-- Inner Red Zone Ring -->
    <circle cx="250" cy="310" r="132" fill="none" stroke="#FFFFFF" stroke-width="4" />

    <!-- Upper Text: RED TEAM -->
    <text font-family="'Chakra Petch', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="9">
      <textPath href="#redTopTextPath" startOffset="50%" text-anchor="middle">
        RED TEAM
      </textPath>
    </text>

    <!-- Side Stars -->
    <!-- Left Star -->
    <polygon points="90,305 94,316 106,316 97,323 100,334 90,327 80,334 83,323 74,316 86,316" fill="#FFFFFF" />
    <!-- Right Star -->
    <polygon points="410,305 414,316 426,316 417,323 420,334 410,327 400,334 403,323 394,316 406,316" fill="#FFFFFF" />

    <!-- Lower Text: FOOTBALL CLUB -->
    <text font-family="'Chakra Petch', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="29" fill="#FFFFFF" letter-spacing="8">
      <textPath href="#redBottomTextPath" startOffset="50%" text-anchor="middle">
        FOOTBALL CLUB
      </textPath>
    </text>

    <!-- Center Star-Ball Cluster (Champions-League Style Interlocking Stars) -->
    <g transform="translate(250, 310) scale(1.15)">
      <!-- Center Star -->
      <polygon points="0,-36 11,-12 36,-12 16,3 23,28 0,14 -23,28 -16,3 -36,-12 -11,-12" fill="#FFFFFF" />
      
      <!-- Top Star -->
      <polygon points="0,-95 7,-78 26,-78 12,-66 18,-48 0,-59 -18,-48 -12,-66 -26,-78 -7,-78" fill="#FFFFFF" />
      
      <!-- Top-Right Star -->
      <polygon points="76,-48 76,-30 94,-35 83,-19 93,-4 75,-8 62,3 64,-15 50,-24 67,-27" fill="#FFFFFF" transform="rotate(25 0 0)" />
      
      <!-- Top-Left Star -->
      <polygon points="-76,-48 -76,-30 -94,-35 -83,-19 -93,-4 -75,-8 -62,3 -64,-15 -50,-24 -67,-27" fill="#FFFFFF" transform="rotate(-25 0 0)" />

      <!-- Left Star -->
      <polygon points="-75,10 -60,20 -70,36 -52,32 -48,50 -35,36 -28,52 -24,35 -8,40 -16,24" fill="#FFFFFF" />
      
      <!-- Right Star -->
      <polygon points="75,10 60,20 70,36 52,32 48,50 35,36 28,52 24,35 8,40 16,24" fill="#FFFFFF" />

      <!-- Bottom Star -->
      <polygon points="0,85 8,68 26,68 13,56 18,38 0,50 -18,38 -13,56 -26,68 -8,68" fill="#FFFFFF" />
      
      <!-- Bottom-Left Star -->
      <polygon points="-58,60 -45,52 -45,68 -32,58 -28,75 -20,60 -10,72 -10,56 2,60 -5,48" fill="#FFFFFF" />
      
      <!-- Bottom-Right Star -->
      <polygon points="58,60 45,52 45,68 32,58 28,75 20,60 10,72 10,56 -2,60 5,48" fill="#FFFFFF" />
    </g>
  </g>
</svg>
